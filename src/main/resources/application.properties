spring.application.name=extractor
# Allow overriding multipart max file sizes via environment variables or defaults
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:20MB}
# Allow overriding server port via env var (e.g., PORT), default 8080
server.port=${PORT:8080}

logging.level.com.pdf.table.extractor=DEBUG